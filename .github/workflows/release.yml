name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/server/package-lock.json
            desktop/renderer/package-lock.json
            after/package-lock.json
            APP/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix desktop
          npm ci --prefix desktop/server
          npm ci --prefix desktop/renderer
          npm ci --prefix after
          npm ci --prefix APP

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageFiles = @(
            './package.json',
            './after/package.json',
            './APP/package.json',
            './desktop/package.json',
            './desktop/server/package.json',
            './desktop/renderer/package.json'
          )
          $versions = $packageFiles | ForEach-Object { node -p "require('$($_)').version" }
          $version = $versions[0]
          if (($versions | Select-Object -Unique).Count -ne 1) {
            throw "Package versions are inconsistent: $($versions -join ', ')"
          }
          $manifestVersion = node -p "require('./APP/src/manifest.json').versionName"
          if ($manifestVersion -ne $version) {
            throw "APP manifest version $manifestVersion does not match package version $version"
          }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop version v$version"
          }

      - name: Run automated verification
        shell: pwsh
        run: |
          npm test
          npm run verify:sync
          npm run verify:local-sync
          npm run build:app
          npm run build:app-resource
          npm exec --prefix desktop/renderer -- playwright install chromium
          npm --prefix desktop/renderer run test:visual:all

      - name: Build Windows installer
        run: npm run build:desktop

      - name: Write checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/release/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content desktop/release/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
            desktop/release/SHA256SUMS.txt
