name: Quality Gate

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            after/package-lock.json
            APP/package-lock.json
            before/package-lock.json
            before/server/package-lock.json
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix after
          npm ci --prefix APP
          npm ci --prefix before
          npm ci --prefix before/server
      - name: Run Vitest
        run: npm test
      - name: Run Three.js visual tests
        shell: pwsh
        run: |
          npm exec --prefix before -- playwright install chromium
          npm --prefix before run test:visual:all
      - name: Verify synchronization
        shell: pwsh
        run: |
          npm run verify:sync
          npm run verify:local-sync
      - name: Build applications
        shell: pwsh
        run: |
          npm run build:api
          npm --prefix before/server run build
          npm --prefix before run build:web
          npm run build:app
          npm run build:app-resource
